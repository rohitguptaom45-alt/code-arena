<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeArena — Compete • Debug • Build • Win</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              bg: '#FFFFFF',
              'bg-soft': '#FFF8F1',
              card: '#FFFFFF',
              accent: '#FF7A00',
              'accent-soft': '#FFA94D',
              'accent-hover': '#FF922B',
              ink: '#111111',
              'ink-soft': '#2D2D2D',
              muted: '#F4F4F4',
              border: '#EAEAEA',
              success: '#22C55E',
              danger: '#EF4444',
              warning: '#F59E0B',
            },
            fontFamily: {
              display: ['Poppins', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            borderRadius: { '2xl': '16px' },
            boxShadow: {
              soft: '0 2px 10px rgba(17,17,17,0.05)',
              lift: '0 12px 30px rgba(255,122,0,0.15)',
            },
          },
        },
      }
    </script>
    <style>
      html { scroll-behavior: smooth; }
      body { background: #FFFFFF; }
      ::selection { background: #FFA94D; color: #111111; }
      @keyframes floaty { 0%,100% { transform: translateY(0px);} 50% { transform: translateY(-10px);} }
      .float { animation: floaty 4s ease-in-out infinite; }
      .float-slow { animation: floaty 6s ease-in-out infinite; }
      .card-lift { transition: transform .25s ease, box-shadow .25s ease; }
      .card-lift:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(255,122,0,0.15); }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #EAEAEA; border-radius: 8px; }
      ::-webkit-scrollbar-thumb:hover { background: #FFA94D; }

      /* Dark mode: retrofit onto the existing semantic utility classes (bg-white, text-ink,
         text-ink-soft, bg-bg-soft, bg-muted, border-border) so the whole app flips without
         needing dark: variants added to every component. */
      html.dark { color-scheme: dark; }
      html.dark body { background: #0b0b0c; }
      html.dark .bg-white { background-color: #17181a !important; }
      html.dark .bg-bg-soft { background-color: #1b1c1f !important; }
      html.dark .bg-muted { background-color: #212226 !important; }
      html.dark .bg-card { background-color: #17181a !important; }
      html.dark .text-ink { color: #f3f3f4 !important; }
      html.dark .text-ink-soft { color: #a9aab0 !important; }
      html.dark .border-border { border-color: #2b2c30 !important; }
      html.dark .divide-border > :not([hidden]) ~ :not([hidden]) { border-color: #2b2c30 !important; }
      html.dark input, html.dark select, html.dark textarea {
        background-color: #1b1c1f; color: #f3f3f4; border-color: #2b2c30;
      }
      html.dark input::placeholder, html.dark textarea::placeholder { color: #6f7076; }
      html.dark ::-webkit-scrollbar-thumb { background: #2b2c30; }
      html.dark .shadow-soft, html.dark .shadow-lift { box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
    </style>
  </head>
  <body class="font-body text-ink">
    <div id="root"></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
